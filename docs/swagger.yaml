    delete:
      description: Soft delete; the board stays in history and can be restored.
      parameters:
      - description: board id
        in: path
        name: id
        required: true
        type: string
      - description: version the delete is based on
        in: query
        name: version
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a board
      tags:
      - platform
    put:
      consumes:
      - application/json
      description: '`version` = the version the edit was based on (0 for a new board).
        A stale version gets 409 with the current copy.'
      parameters:
      - description: board id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Save a board
      tags:
      - platform
