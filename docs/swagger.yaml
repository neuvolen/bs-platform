  /api/v1/platform/import:
    post:
      consumes:
      - application/json
      description: Body = the platform's localStorage dump. Boards are matched by
        id; the newer copy wins and the older one is kept in history. Sections already
        on the server are not overwritten and are listed in the report.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Move a browser's data to the server
      tags:
      - platform
  /api/v1/platform/sync:
    get:
      description: Boards and sections changed after `since`. Poll with the returned
        `rev` to pick up other devices' edits.
      parameters:
      - description: last rev the client has seen (0 = everything)
        in: query
        name: since
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Changes since a revision
      tags:
      - platform
produces:
- application/json
